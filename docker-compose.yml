services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    ports:
      - "8001:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - image-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - image-data:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    environment:
      API_HOST: api
      API_PORT: 8000
    depends_on:
      - api

volumes:
  image-data:
